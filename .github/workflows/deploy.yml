name: CI → Deploy to production

# Runs on every push to updated-WA.
#
# Gate order (each must pass before the next runs):
#   1. npm ci           — clean dependency install (catches lock-file drift)
#   2. npm test         — full Jest suite (0 failures required)
#   3. docker build     — image builds without errors
#   4. rsync to EC2     — only reached if all three above pass
#   5. docker compose up — rolls out new image
#   6. health check     — verifies the new container is serving HTTPS
#
# If the build or tests fail, the currently-running container is untouched.
# Only a fully-verified commit can replace the live service.
on:
  push:
    branches:
      - updated-WA

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean dependency install
        run: npm ci

      - name: Run full test suite
        run: npm test -- --forceExit
        env:
          # Ensure the CI environment is clean — no production .env exists here,
          # but be explicit so the guard in src/config/app.js and tests/setup.js
          # is never accidentally bypassed.
          NODE_ENV: test
          # CI has no real Gemini key; tests mock it. An empty string is correct.
          GEMINI_API_KEY: ''

      - name: Verify Docker image builds cleanly
        run: docker build --no-cache -t whatsapp-automation:ci-${{ github.sha }} .

  deploy:
    name: Deploy to production
    needs: test          # only runs if the test job above passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' \
            --exclude='.wwebjs_auth' --exclude='.wwebjs_cache' --exclude='data' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/whatsapp-automation/

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/ubuntu/whatsapp-automation
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          '

      - name: Verify it is actually reachable over HTTPS
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://ai4automation.in/health; then exit 0; fi
            sleep 10
          done
          echo "Health check failed after retries"; exit 1
